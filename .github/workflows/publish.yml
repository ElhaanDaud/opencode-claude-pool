name: Publish to npm

# Runs only after CI has passed on a push to main, so a commit that fails its
# tests is never published. The version check below makes a run without a
# version bump a no-op.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  publish:
    # The npm package belongs to upstream; forks must not publish under its name.
    if: >-
      github.repository == 'dotCipher/opencode-claude-bridge' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The commit CI tested, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: Check if version changed
        id: version
        run: |
          PUBLISHED=$(npm view opencode-claude-bridge version 2>/dev/null || echo "0.0.0")
          CURRENT=$(node -p "require('./package.json').version")
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISHED" != "$CURRENT" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.version.outputs.changed == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.current }}"
          gh release create "v${VERSION}" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "v${VERSION}" \
            --notes "Published to npm: https://www.npmjs.com/package/opencode-claude-bridge/v/${VERSION}" \
            --latest
